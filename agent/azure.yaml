# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=0.1.0-preview'
name: ai-foundry-starter-basic
services:
    agent-framework-agent-basic-responses:
        project: src/agent-framework-agent-basic-responses
        host: azure.ai.agent
        language: docker
        docker:
            remoteBuild: true
        config:
            container:
                resources:
                    cpu: "0.25"
                    memory: 0.5Gi
            deployments:
                # gpt-4o-mini (2024-07-18) retired for new deployments on 2026-10-01;
                # substituting gpt-4.1-mini as the baseline model for this agent.
                - model:
                    format: OpenAI
                    name: gpt-4.1-mini
                    version: "2025-04-14"
                  name: gpt-4o-mini
                  sku:
                    capacity: 30
                    name: GlobalStandard
    agent-framework-agent-broken-model:
        project: src/agent-framework-agent-broken-model
        host: azure.ai.agent
        language: docker
        docker:
            remoteBuild: true
        config:
            container:
                resources:
                    cpu: "0.25"
                    memory: 0.5Gi
    agent-framework-agent-gpt5-mini:
        project: src/agent-framework-agent-gpt5-mini
        host: azure.ai.agent
        language: docker
        docker:
            remoteBuild: true
        config:
            container:
                resources:
                    cpu: "0.25"
                    memory: 0.5Gi
    agent-framework-agent-gpt41-mini:
        project: src/agent-framework-agent-gpt41-mini
        host: azure.ai.agent
        language: docker
        docker:
            remoteBuild: true
        config:
            container:
                resources:
                    cpu: "0.25"
                    memory: 0.5Gi
    agent-framework-agent-hardened:
        project: src/agent-framework-agent-hardened
        host: azure.ai.agent
        language: docker
        docker:
            remoteBuild: true
        kind: hosted
        name: agent-framework-agent-hardened
        protocols:
            - protocol: responses
              version: 1.0.0
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${MODEL_DEPLOYMENT_NAME}
            ENABLE_INSTRUMENTATION: 'true'
            ENABLE_SENSITIVE_DATA: 'false'
infra:
    provider: bicep
    path: ./infra
